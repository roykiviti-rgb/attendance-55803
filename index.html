<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>יסודות המימון — רישום נוכחות</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #667080;
      --border: #dde1e6;
      --accent: #1f5fbf;
      --accent-text: #ffffff;
      --selected: #e8f0fc;
      --ok: #1a7f45;
      --ok-bg: #e7f5ec;
      --err: #b42318;
      --err-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b1f25;
        --text: #e8eaed;
        --muted: #9aa3ae;
        --border: #2e343c;
        --accent: #5b9bff;
        --accent-text: #0b1420;
        --selected: #1d2c44;
        --ok: #5fd08d;
        --ok-bg: #15291e;
        --err: #ff8a80;
        --err-bg: #331b19;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }
    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    label.lbl { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="search"] {
      width: 100%;
      font: inherit;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }
    input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    ul.names {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      max-height: 46vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    ul.names li + li { border-top: 1px solid var(--border); }
    ul.names button {
      width: 100%;
      text-align: start;
      font: inherit;
      color: var(--text);
      background: none;
      border: 0;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    ul.names button[aria-checked="true"] { background: var(--selected); font-weight: 600; }
    ul.names button[aria-checked="true"]::after { content: "✓"; color: var(--accent); }
    .empty { padding: 12px 14px; color: var(--muted); }
    .chosen { margin: 14px 0 0; min-height: 1.5em; color: var(--muted); }
    .chosen strong { color: var(--text); }
    button.submit {
      width: 100%;
      margin-top: 12px;
      font: inherit;
      font-weight: 600;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button.submit:disabled { opacity: .45; cursor: default; }
    .msg {
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
    }
    .msg .icon { font-size: 2.2rem; line-height: 1; margin-bottom: 8px; }
    .msg h2 { font-size: 1.15rem; margin: 0 0 4px; }
    .msg p { margin: 0; }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .msg.err { background: var(--err-bg); color: var(--err); }
    .msg + .card { margin-top: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>יסודות המימון — רישום נוכחות</h1>
  <p class="sub" id="lecInfo">קורס 55803 · האוניברסיטה העברית</p>

  <div id="result" class="msg" hidden role="status" aria-live="polite">
    <div class="icon" id="resultIcon"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
  </div>

  <p class="sub" id="loading">טוען…</p>

  <form id="form" class="card" hidden>
    <label class="lbl" for="search">בחרו את שמכם</label>
    <input type="search" id="search" placeholder="חיפוש שם…" autocomplete="off">
    <ul class="names" id="names" role="radiogroup" aria-label="רשימת סטודנטים"></ul>
    <p class="chosen" id="chosen">לא נבחר שם</p>
    <button type="submit" class="submit" id="submit" disabled>רשום נוכחות</button>
  </form>
</main>

<script>
  // כתובת ה-Cloudflare Worker (לא סוד — המפתח הסודי נמצא רק ב-Worker)
  const WORKER_URL = "https://attendance-55803.roykiviti.workers.dev";

  const ERRORS = {
    invalid: ["קוד לא תקין", "הקוד שנסרק אינו תקין. סרקו שוב את הקוד מהדף."],
    expired: ["פג תוקף", "תוקף הקוד הסתיים. פנו למרצה."],
    used: ["קוד כבר שומש", "הקוד הזה כבר נוצל לרישום נוכחות. כל דף תקף לרישום אחד בלבד."],
    unknown_name: ["שם לא ברשימה", "השם שנבחר לא נמצא ברשימת הסטודנטים."],
    network: ["אין חיבור", "לא הצלחנו להתחבר לשרת. בדקו את החיבור לאינטרנט ונסו שוב."],
    server: ["שגיאת שרת", "משהו השתבש. נסו שוב בעוד רגע."],
  };

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const code = {
    id: params.get("id") || "",
    lec: params.get("lec") || "",
    exp: params.get("exp") || "",
    sig: params.get("sig") || "",
  };
  const doneKey = "attendance-done:" + code.id;
  let selected = null;
  let names = [];

  function showResult(kind, title, text) {
    $("loading").hidden = true;
    $("resultIcon").textContent = kind === "ok" ? "✓" : "✕";
    $("result").className = "msg " + kind;
    $("resultTitle").textContent = title;
    $("resultText").textContent = text;
    $("result").hidden = false;
  }

  function showError(key) {
    const [title, text] = ERRORS[key] || ERRORS.server;
    showResult("err", title, text);
  }

  function showSuccess(name) {
    $("form").hidden = true;
    showResult("ok", "הנוכחות נרשמה", name + " — תודה!");
  }

  function lectureLabel(lec) {
    const m = /^(\d+)-(\d{4})-(\d{2})-(\d{2})$/.exec(lec);
    return m ? `הרצאה ${m[4]}.${m[3]}.${m[2]}` : "";
  }

  function renderNames() {
    const q = $("search").value.trim().normalize("NFC");
    const list = $("names");
    list.textContent = "";
    const shown = names.filter((n) => n.includes(q));
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "לא נמצאו שמות";
      list.appendChild(li);
      return;
    }
    for (const n of shown) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(n === selected));
      b.textContent = n;
      b.addEventListener("click", () => {
        selected = n;
        $("chosen").innerHTML = "";
        $("chosen").append("נבחר/ה: ");
        const s = document.createElement("strong");
        s.textContent = n;
        $("chosen").append(s);
        $("submit").disabled = false;
        renderNames();
      });
      li.appendChild(b);
      list.appendChild(li);
    }
  }

  async function submit(e) {
    e.preventDefault();
    if (!selected) return;
    $("submit").disabled = true;
    $("submit").textContent = "שולח…";
    $("result").hidden = true;
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...code, name: selected }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.ok) {
        try { localStorage.setItem(doneKey, selected); } catch {}
        showSuccess(selected);
        return;
      }
      showError(data.error);
      if (data.error === "used" || data.error === "expired" || data.error === "invalid") {
        $("form").hidden = true;
        return;
      }
    } catch {
      showError("network");
    }
    $("submit").disabled = false;
    $("submit").textContent = "רשום נוכחות";
  }

  async function init() {
    const label = lectureLabel(code.lec);
    if (label) $("lecInfo").textContent = label + " · קורס 55803";

    if (!code.id || !code.lec || !code.exp || !code.sig) {
      showResult("err", "קוד לא תקין", "יש לסרוק את קוד ה-QR מהדף שקיבלתם בכיתה.");
      return;
    }

    let done = null;
    try { done = localStorage.getItem(doneKey); } catch {}
    if (done) { showSuccess(done); return; }

    // רשימת השמות מגיעה מה-Worker, ורק עבור קוד תקף שעוד לא נוצל
    try {
      const res = await fetch(WORKER_URL + "/names", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(code),
      });
      const data = await res.json().catch(() => ({}));
      if (!data.ok) {
        showError(data.error);
        return;
      }
      const collator = new Intl.Collator("he");
      names = data.names.map((n) => n.normalize("NFC").trim()).sort(collator.compare);
    } catch {
      showError("network");
      return;
    }

    $("loading").hidden = true;
    $("form").hidden = false;
    $("search").addEventListener("input", renderNames);
    $("form").addEventListener("submit", submit);
    renderNames();
  }

  init();
</script>
</body>
</html>
